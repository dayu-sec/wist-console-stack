# >>> wist-cred · wist-console · 本文件由接入脚本维护，重跑会整份重写 >>>
# 消费方式：程序启动时加一行 —— --credentials <本文件路径>（挂进容器后就是容器内路径）。
# 下面的相对路径按**本文件所在目录**解 —— 整个目录一起挂进容器即可。
[identity]
cert      = "server.crt"
key       = "server.key"
client_ca = "client-ca.pem"

[verify]
audience        = "wist-console"
allowed_issuers = ["wist-cred"]
require_signature = true
issuer_public_key_file = "issuer-signing.pub"
roles = ["admin", "read"]
# <<< wist-cred · wist-console <<<

