# WarpParse → 资产拓扑（wist-atlas）写入连接器
#
# 放到 wparse 工作根的 `connectors/sink.d/` 下（建议编号 40-，排在证据连接器之后）。
#
# 目标：POST ${ATLAS_SINK_URL}/internal/atlas
# 请求体（两字段）：{"cust_id":"<租户 UUID>","content":{...}}
#   比证据服务少一个 cmd_id —— 那是证据的幂等键，atlas 用快照里的 snap_id。
#
# 认证：**不需要**。写端点只在内网开放，P1 换成 HTTPS 双向认证 —— 连接器目前没有
#       TLS 参数，所以写端点只在内网暴露。
[[connectors]]
allow_override = [
  "endpoint",
  "headers",
  "fmt",
  "batch_size",
  "timeout_secs",
  "max_retries",
]
id = "atlas_sink"
type = "http"

[connectors.params]
endpoint = "${ATLAS_SINK_URL}/internal/atlas"
method = "POST"
fmt = "json"
batch_size = 1
timeout_secs = 5
max_retries = 3
compression = "none"

[connectors.params.headers]
Content-Type = "application/json"
