# WarpParse → 证据库（wist-evidence）写入连接器
#
# 放到 wparse 工作根的 `connectors/sink.d/` 下（建议编号 30-，排在通用 http 模板之后）。
#
# 目标：POST ${EVIDENCE_SINK_URL}/internal/evidence
# 请求体（三字段）：{"cust_id":"c-001","cmd_id":"cmd-...","content":{...}}
#
# 认证：**不需要**。写端点只在内网开放，P1 换成 HTTPS 双向认证
#       —— 连接器目前没有 TLS 参数，所以写端点只在内网暴露。
[[connectors]]
allow_override = [
  "endpoint",
  "headers",
  "fmt",
  "batch_size",
  "timeout_secs",
  "max_retries",
]
id = "evidence_sink"
type = "http"

[connectors.params]
endpoint = "${EVIDENCE_SINK_URL}/internal/evidence"
method = "POST"
fmt = "json"
batch_size = 1
timeout_secs = 5
max_retries = 3
compression = "none"

[connectors.params.headers]
Content-Type = "application/json"
