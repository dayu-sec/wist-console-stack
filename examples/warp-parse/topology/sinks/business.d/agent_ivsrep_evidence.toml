# 调查报告（` IVSREP: ` 帧）直接写入证据库
#
# 放到 wparse 工作根的 `topology/sinks/business.d/` 下。
#
# 前提：平台侧 ingest 必须已经加载 `agent_uplink_ivsrep` 的 WPL/OML
#       （目前这套规则只在网关栈里，平台 ingest 侧要同步过去；见 examples/warp-parse/README.md）。
#
# 一条记录 = 一份报告：`schema`（IVSREP）/ `agent` / `ts` / `seq` / `body`（报告 JSON 原文）。
# 证据服务只读这几个闭集字段，`body` 原样落对象存储。
[sink_group]
name = "agent-ivsrep-evidence"
oml = ["agent_uplink_ivsrep"]
tags = ["biz:agent-ivsrep"]
batch_size = 1
batch_timeout_ms = 300

[[sink_group.sinks]]
name = "evidence"
connect = "evidence_sink"
tags = ["sink:evidence"]

[sink_group.sinks.params]
endpoint = "${EVIDENCE_SINK_URL}/internal/evidence"
batch_size = 1
