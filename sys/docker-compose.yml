# wist-console-stack — 计算区运维台（证据 / 资产拓扑 / 采集量 / 设备状态）
#
# 角色分工（浏览器只接触 web）：
#   web         console-web：静态托管 + 同源反代（/api → console，/atlas/ → atlas-web）
#   console     console BFF：到证据服务的身份、健康聚合、预签名转发
#   evidence    wist-evidence：索引 + 对象存储（正文只在计算区与 COS 之间流动）
#   atlas       wist-atlas：资产与拓扑 API
#   atlas-web   wist-atlas-web：拓扑画布（挂在 /atlas/，不单独对外）
#   两个 PG     证据与资产生命周期不同，刻意分开
#
# 端口（宿主:容器；宿主端口与 BIND_IP 见 sys/setting/vars.yml）：
#   web              ${WEB_BIND_IP}:${WEB_HOST_PORT}:80      唯一浏览器入口
#   evidence（写）    ${EVIDENCE_SINK_BIND_IP}:${EVIDENCE_SINK_HOST_PORT}:8080
#                    给平台数据面 wparse http_sink 投递；**这是唯一需要内网开放的端口**
#   evidence-pg      ${PG_BIND_IP}:${EVIDENCE_PG_HOST_PORT}:5432
#   atlas-pg         ${PG_BIND_IP}:${ATLAS_PG_HOST_PORT}:5432
#   evidence（读）/ console / atlas / atlas-web：只在 compose 网络内，不绑宿主端口
name: wist-console-stack

services:
  evidence-postgres:
    container_name: wist-console-stack-evidence-postgres
    image: ${PG_REGISTRY}/postgres:${PG_IMAGE_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVIDENCE_PG_DB}
      POSTGRES_USER: ${EVIDENCE_PG_USER}
      POSTGRES_PASSWORD: ${EVIDENCE_PG_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${PG_BIND_IP}:${EVIDENCE_PG_HOST_PORT}:5432"
    volumes:
      - evidence-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVIDENCE_PG_USER} -d ${EVIDENCE_PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  atlas-postgres:
    container_name: wist-console-stack-atlas-postgres
    image: ${PG_REGISTRY}/postgres:${PG_IMAGE_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ATLAS_PG_DB}
      POSTGRES_USER: ${ATLAS_PG_USER}
      POSTGRES_PASSWORD: ${ATLAS_PG_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${PG_BIND_IP}:${ATLAS_PG_HOST_PORT}:5432"
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ATLAS_PG_USER} -d ${ATLAS_PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  evidence:
    container_name: wist-console-stack-evidence
    image: ${CONSOLE_REGISTRY}/wist-evidence:${EVIDENCE_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      evidence-postgres:
        condition: service_healthy
    environment:
      WIST_EVIDENCE_CONFIG: /etc/wist-evidence/wist-evidence.toml
      WIST_EVIDENCE_SEC_FILE: /sec/sec-value.yml
      TZ: ${TZ}
    ports:
      # 写端口（明文，只在内网）：数据面 http_sink 直投。
      - "${EVIDENCE_SINK_BIND_IP}:${EVIDENCE_SINK_HOST_PORT}:8080"
    volumes:
      - ./configs/evidence:/etc/wist-evidence:ro
      # 密钥真值（DB URL / COS 凭据 / sink token）：`sys/.wist/sec-value.yml`，0640。
      - ./.wist:/sec:ro
    healthcheck:
      # 读监听是 8443（P0 明文 + 身份头；mTLS 在 P1），走 busybox，不依赖 curl。
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8443/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  atlas:
    container_name: wist-console-stack-atlas
    image: ${ATLAS_REGISTRY}/wist-atlas:${ATLAS_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      atlas-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${ATLAS_PG_USER}:${ATLAS_PG_PASSWORD}@atlas-postgres:5432/${ATLAS_PG_DB}
      TZ: ${TZ}
    command: ["postgres-live", "serve", "--listen", "0.0.0.0:8080"]
    healthcheck:
      test: ["CMD-SHELL", "/bin/busybox wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  atlas-web:
    container_name: wist-console-stack-atlas-web
    image: ${ATLAS_REGISTRY}/wist-atlas-web:${ATLAS_WEB_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      atlas:
        condition: service_healthy
    # 不绑宿主端口：只由 web 的 `location /atlas/` 反代进来。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  console:
    container_name: wist-console-stack-console
    image: ${CONSOLE_REGISTRY}/wist-console:${CONSOLE_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      evidence:
        condition: service_healthy
    environment:
      WIST_CONSOLE_CONFIG: /etc/wist-console/console.toml
      WIST_CONSOLE_SEC_FILE: /sec/sec-value.yml
      TZ: ${TZ}
    volumes:
      - ./configs/console:/etc/wist-console:ro
      - ./.wist:/sec:ro
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    container_name: wist-console-stack-web
    image: ${CONSOLE_REGISTRY}/wist-console-web:${CONSOLE_WEB_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      console:
        condition: service_healthy
      atlas-web:
        condition: service_started
    ports:
      - "${WEB_BIND_IP}:${WEB_HOST_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  evidence-pgdata:
  atlas-pgdata:
