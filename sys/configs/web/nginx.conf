# 星象台前端（console-web）的站点配置 —— **TLS 终结在这里**。
#
# 由 `sys/scripts/init-stack.sh` 从本文件复制到运行态 `configs/web/nginx.conf`，
# compose 把它挂到 `/etc/nginx/conf.d/default.conf`；证书目录 `identity/web` 挂到 `/certs`。
#
# 为什么栈里自己带一份、而不用镜像里烤好的那份：镜像那份是 HTTP 版本（开发/单独跑 console-web
# 时用），站点部署必须终止 TLS —— 访问令牌是 bearer，明文传输等于把凭据写在网线上。
#
# 证书由 `sys/scripts/init-web-tls.sh <域名>` 生成（两级：web CA + 叶），
# 把 `identity/web/public/web-ca.crt.pem` 导入浏览器信任库一次即可免提示。

# ── 80：只留健康检查（健康检查不走证书，避免证书过期把容器拖成 unhealthy）──
# 注意：本端口**不发布到宿主**；对外只有 443。这里不留跳转 ——
# 把 80 跳到 https 会把错误的端口（80）带进 URL。
server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 404;
    }
}

# ── 443：真正的入口 ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/public/web-tls.crt.pem;
    ssl_certificate_key /certs/private/web-tls.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 容器重建后 IP 会变。`proxy_pass http://console:8080` 这种写法只在**启动时**解析一次，
    # 上游一重建，这里就会拿着旧 IP 回 404/502（症状：页面能开、所有 /api 挂掉）。
    # 用变量 + resolver 让 nginx 按 TTL 重新解析（Docker 内嵌 DNS：127.0.0.11）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 凭据 bearer 不进日志：默认 access_log 只记请求行，不记 Authorization 头；
    # 这里显式声明一次，避免以后有人加 `log_format` 时把整头打进去。
    access_log /var/log/nginx/access.log;

    # BFF：浏览器只跟本容器说话。
    #
    # 身份（VPN/堡垒机 + mTLS）由**入口**终结，注入到请求头里；
    # 本容器不持有证据服务的客户端证书，也不直接连证据服务。
    location /api {
        set $console_upstream console:8080;
        proxy_pass http://$console_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # 资产拓扑：静态资源由 atlas-web 托管（iframe 的入口与 bundle 不带数据）。
    #
    # 前提：atlas-web 必须以相对资源路径构建（`base: './'`），否则它的 `/assets/*` 会打到
    # 本域名根，页面白屏。深链（聚焦某台主机）走 `/atlas/#/host/<id>`，不做跨域 iframe。
    # 变量形式的 proxy_pass 不会自动去掉 `/atlas` 前缀，所以用 rewrite 显式剥。
    # 注意：`break` 会终止 rewrite 阶段，**必须先把 set 写在前**，否则变量未初始化 → 500。
    location /atlas/ {
        set $atlas_web_upstream atlas-web:80;
        rewrite ^/atlas/(.*)$ /$1 break;
        proxy_pass http://$atlas_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 资产**数据**面不从 nginx 直连 atlas，而是绕回 BFF：
    #   /atlas/api/hosts → console `/api/atlas/hosts` → atlas `/hosts`
    # 令牌校验因此只有一道门（BFF 的 require_operator）。
    # 前缀匹配里 `/atlas/api/` 比 `/atlas/` 更长，所以这条优先。
    location /atlas/api/ {
        set $console_api_upstream console:8080;
        rewrite ^/atlas/api/(.*)$ /api/atlas/$1 break;
        proxy_pass http://$console_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退。图标与入口 HTML 不缓存（换版本后要能立刻拿到新 bundle）。
    location ~* ^/(favicon\.(svg|ico)|apple-touch-icon\.png)$ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    }

    location = / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
