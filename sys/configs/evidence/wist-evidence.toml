# 证据服务（wist-evidence）配置 —— 计算区 stack 口径
#
# `${SEC_...}` 的真值在 `sys/.wist/sec-value.yml`（0640），不写在这里。

# ── 写面：数据面 http_sink 直投（明文，只在内网）────────────────────────────
[sink]
listen_addr = "0.0.0.0:8080"
max_body_bytes = 4194304
# P0 只开调查报告；`diagnose_report` 等加进这个列表即可。
allowed_kinds = ["investigation_report"]

# 站点 token：**键**是 token（从密钥文件展开），值是租户 / 客户声明。
# 一个站点一个 token；轮换 = 换密钥文件后重启。
[sink.tokens."${SEC_EVIDENCE_SINK_TOKEN}"]
tenant_id = "t-001"
customer_id = "c-001"

# ── 读面：console BFF 调用（P0 明网 + 身份头；mTLS 在 P1）─────────────────
[read]
listen_addr = "0.0.0.0:8443"

# ── 索引：独立库（不与环境里的其它服务共用）────────────────────────────────
[index]
kind = "postgres"
database_url = "${SEC_EVIDENCE_DB_URL}"

# ── 对象存储：两种模式（file | s3）────────────────────────────────────────
# file：本地目录，方便测试/现场验证 —— 重启不丢，能直接看文件；**不支持预签名**。
# s3  ：生产用（腾讯 COS / MinIO），支持 60s 短签名 URL。
[objects]
kind = "file"
dir = "/var/lib/wist-evidence/objects"
bucket = "wist-evidence"

# 生产切 COS（S3 兼容）：
# kind = "s3"
# endpoint = "${SEC_COS_ENDPOINT}"
# region = "${SEC_COS_REGION}"
# access_key = "${SEC_COS_SECRET_ID}"
# secret_key = "${SEC_COS_SECRET_KEY}"
