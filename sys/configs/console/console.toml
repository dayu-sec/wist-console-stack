# console BFF 配置 —— 计算区 stack 口径
#
# 浏览器只跟 BFF 说话；到证据服务的租户 / scope / 敏感度只在这里。

[server]
listen_addr = "0.0.0.0:8080"

[auth]
# ingress：入口（VPN / 堡垒机 / 反代）必须注入操作者头。
# dev 只用于本机联调，**不要**在共享网络上用。
mode = "ingress"
operator_header = "x-console-operator"

# 身份：**这里的 tenant 就是客户 id**（证据服务的租户=客户）。
# 想同时看多个客户需要 console 侧加客户筛选（当前一页一个客户）。
# 端口来自栈级变量 `EVIDENCE_READ_PORT`，与证据服务的监听保持同一个来源。
[evidence]
base_url = "http://evidence:${EVIDENCE_READ_PORT}"
tenant = "c-001"
scopes = ["evidence:read"]
max_sensitivity = "paths"
timeout_secs = 10

# 资产拓扑：`base_url` 用于 `/api/health` 探活（读 `/healthz`，里面带写探针结果）；
# `sink_url` 是**数据面视角**的写端点，只用于「接入」页展示 / copy。
# 页面本体由 atlas-web 嵌在 `/atlas/`。
[atlas]
base_url = "http://atlas:8080"
sink_url = "http://127.0.0.1:18801"

# 运行指标：VictoriaMetrics 的查询入口（栈内）。
# 只用于探活与后续「运行指标」页；数据面上报走它自己的 remote-write 端点。
[metrics]
base_url = "http://metrics:8428"

# 展示在「数据面接入」页的写端点（**数据面视角**的地址，不是容器内地址）。
# 现场改成 EVIDENCE_SINK_BIND_IP 对应的内网地址 + 端口。
[integration]
sink_url = "http://127.0.0.1:18800"
# 上面那个地址 BFF 到不了，所以写端点的**探活**另给一条 BFF 视角的地址：
# 证据写监听在容器内 8080，与读监听（8443）分开。
sink_health_url = "http://evidence:8080/healthz"
